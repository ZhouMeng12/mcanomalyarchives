// 不复刻玩法公式：JUnit 直接调用 src/main/java 中真正运行的队列与同步策略。
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// ModDev 默认只给 main 接 Minecraft classpath；NBT 回归也要使用同一套真实运行依赖。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
    }
}
